[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tare-tools-specgraph"
version = "0.7.9"
description = "Spec-Driven Development (SDD) & Universal Project Intelligence Engine: Causal Traceability Matrix from Intent to AST and Verification."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "Augusto Carvalho", email = "augusto-scarvalho@users.noreply.github.com" }
]
keywords = [
    "spec-driven-development",
    "sdd",
    "traceability-matrix",
    "ast-analysis",
    "ai-agents",
    "context-engineering",
    "tare-tools"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Code Generators",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "pyyaml>=6.0"
]

[project.optional-dependencies]
multilanguage = [
    "tree-sitter>=0.25,<0.26",
    "tree-sitter-typescript>=0.23,<0.24",
    "tree-sitter-rust>=0.24,<0.25"
]
# Native import graph for test impact; without it SpecGraph falls back to Python's ast.
fast = [
    "ruff>=0.16,<0.17"
]
dev = [
    "pytest>=7.0",
    "psutil>=5.9; sys_platform == 'win32'"
]

[project.scripts]
specgraph = "specgraph.cli:main"
spec-graph = "specgraph.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --tb=short"
markers = ["verifies(spec_id, *criteria): declare a specification test link; not execution attestation"]
