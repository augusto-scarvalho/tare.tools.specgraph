name: CI

on:
  workflow_dispatch:
    inputs:
      x5_campaign:
        description: 'Explicitly run the costly X5 qualification campaign'
        type: boolean
        default: false
  schedule:
    - cron: '0 9 * * 1'
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Tests (${{ matrix.platform }})
    # GitHub-hosted runners by default. The repository variables CI_RUNNER_LINUX and CI_RUNNER_WINDOWS (a JSON
    # label or label list, e.g. ["self-hosted","Linux"]) move a platform to your own runners; pull requests from
    # forks then skip this job, since they could run any code there.
    if: >-
      github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
      || (!vars.CI_RUNNER_LINUX && !vars.CI_RUNNER_WINDOWS)
    # Only an explicit X5 campaign request extends the normal CI timeout.
    timeout-minutes: ${{ (github.event_name == 'workflow_dispatch' && inputs.x5_campaign) && 150 || 20 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            runner: ${{ vars.CI_RUNNER_LINUX || '"ubuntu-latest"' }}
          - platform: windows
            runner: ${{ vars.CI_RUNNER_WINDOWS || '"windows-latest"' }}
    runs-on: ${{ fromJSON(matrix.runner) }}
    env:
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: core.longpaths
      GIT_CONFIG_VALUE_0: "true"
      # The kernel and agent runtime revisions the integration tests run against (README: Run the tests).
      RUNTIME_REVISION: 133d9bba5c584c1959595a50e86430670bf666f2
      KERNEL_REVISION: 35cc5dc18c0e9da72085144f94e371d2389aab91
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install with every extra and the pinned kernel and runtime
        run: >-
          python -m pip install -e ".[dev,multilanguage,fast]" pydantic
          "git+https://github.com/augusto-scarvalho/tare.tools.kernel@${{ env.KERNEL_REVISION }}"
          "git+https://github.com/augusto-scarvalho/tare.tools.agent-runtime@${{ env.RUNTIME_REVISION }}"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache the native core build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust/specgraph-core

      - name: Test the native core (specgraph-core)
        run: cargo test --release --locked --manifest-path rust/specgraph-core/Cargo.toml

      - name: Build the native core (specgraph-core)
        run: cargo build --release --locked --manifest-path rust/specgraph-core/Cargo.toml

      - name: Require complete optional and owner integration
        run: >-
          python -c "import tree_sitter, tree_sitter_typescript, tree_sitter_rust;
          from compute_plane.managed_work import ObservedWorkProgress;
          assert 'evidence_bytes' in ObservedWorkProgress.__dataclass_fields__"

      - name: Check document contracts
        run: python tools/check_completion_contracts.py

      - name: Run SpecGraph and changelog tests
        run: python -m pytest tests tools/tests -v --junitxml=ci-results.xml

      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: specgraph-tests-${{ matrix.platform }}-${{ github.sha }}
          path: ci-results.xml
          if-no-files-found: ignore

      - name: Measure X5 controls without changing release test selection
        if: github.event_name == 'workflow_dispatch' && inputs.x5_campaign
        run: python tools/x5_campaign.py --output "${{ runner.temp }}/x5-${{ github.run_id }}-${{ github.run_attempt }}"

      - name: Preserve X5 campaign evidence
        if: always() && github.event_name == 'workflow_dispatch' && inputs.x5_campaign
        uses: actions/upload-artifact@v4
        with:
          name: x5-${{ matrix.platform }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/x5-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 90
          if-no-files-found: warn
