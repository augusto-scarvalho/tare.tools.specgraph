[package]
name = "specgraph-core"
version = "0.1.0"
edition = "2021"
description = "Native symbol extraction, binding and test impact for SpecGraph"
license = "MIT"

[[bin]]
name = "specgraph-core"
path = "src/main.rs"

[dependencies]
tree-sitter = "0.25"
tree-sitter-python = "0.25"
rayon = "1.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "thin"
codegen-units = 4
